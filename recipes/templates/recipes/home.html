{% extends 'recipes/base.html' %}

{% block content %}

<h2 class="mb-3">Recipes</h2>

<input type="text" id="search" class="form-control mb-3" placeholder="Search recipes...">

<div class="row">
    {% for recipe in recipes %}
    <div class="col-md-4 recipe-card mb-3">

        <div class="card shadow-sm">
            
            {% if recipe.image %}
            <img src="{{ recipe.image }}" class="card-img-top" style="height:200px; object-fit:cover;">
            {% endif %}

            <div class="card-body">
                <h5 class="card-title">{{ recipe.title }}</h5>

                <a href="{% url 'detail' recipe.pk %}" class="btn btn-primary btn-sm">
                    View
                </a>

                <a href="{% url 'update' recipe.pk %}" class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="{% url 'delete' recipe.pk %}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </div>

        </div>

    </div>
    {% endfor %}
</div>

{% endblock %}
