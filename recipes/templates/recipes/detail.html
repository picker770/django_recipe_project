{% extends 'recipes/base.html' %}

{% block content %}

<div class="card shadow-sm p-3">

    <h2>{{ recipe.title }}</h2>

    {% if recipe.image %}
    <img src="{{ recipe.image }}" class="img-fluid mb-3">
    {% endif %}

    <h5>Ingredients</h5>
    <p>{{ recipe.ingredients }}</p>

    <h5>Instructions</h5>
    <p>{{ recipe.instructions }}</p>

</div>

<a href="/" class="btn btn-secondary mt-3">Back</a>

{% endblock %}
